[project]
name = "assetpipe"
version = "1.0.0"
description = "PrettyDesk developer-only asset pipeline: prompts, validation, variants, review sheets, publishing."
requires-python = ">=3.11"
dependencies = ["pyyaml>=6", "pillow>=10", "numpy>=1.26"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
assetpipe = "assetpipe.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
