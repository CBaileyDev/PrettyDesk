pack: default.clean-white
kind: default
title: "Clean White"
styleBible: |
  We are creating a cohesive series of premium desktop wallpapers called Clean White. Every image is bright,
  airy and quiet: warm off-white plaster, paper, ceramic, snow and linen in #F4F2EE, #E8E6E1 and #CFC8BC, with
  soft grey-taupe shadows and never any pure glaring white. The look is minimalist interior and architectural
  photography in natural daylight, with true-to-life texture and large areas of calm negative space. Gradients
  of light are smooth and banding-free. No text of any kind, no people, no frames or borders. Keep the left edge
  and the bottom edge calm and low-contrast for desktop icons and the taskbar.
wallpapers:
  - id: cw-01
    title: "Afternoon Leaf Shadows"
    role: default
    tone: light
    setupMatch: [white, wood]
    tags: [botanical, shadow, plaster]
    starter: true
    accent: "#B9B2A6"
    focal: { x: 0.62, y: 0.42 }
    upscaler: x4plus
    grain: 0.2
    portrait: true
    prompts:
      landscape: |
        A 16:9 landscape desktop wallpaper. A softly textured warm off-white plaster wall in late-afternoon sun.
        Crisp but gentle shadows of a leafy olive branch and a few long grass blades fall diagonally across the
        wall from the upper right, slightly blurred at their tips as if the plant sits a little way from the
        wall. A faint warm glow fades toward the lower left.
        Style: minimalist interior photography, natural light, true-to-life plaster texture, quiet and airy.
        Palette: #F4F2EE, #E8E4DC, #CFC8BC with soft grey-taupe shadows #B9B2A6. Mood: serene, clean, sunlit.
        Composition: the densest cluster of leaf shadows sits about 52–72% across and 30–54% down; the shadows
        thin out toward the edges. The left 15% and the bottom 8% stay calm and low-detail (desktop icons and
        taskbar go there). Keep every important element inside the central 80% of the width and the middle 70%
        of the height so the image can be cropped to other screen shapes.
        Technical: highest available resolution; crisp detail in the shadow edges; perfectly smooth,
        banding-free gradients; no noise, no vignette, no border or frame.
        Strictly no text, letters, numbers, logos, symbols, watermarks, signatures, UI elements, furniture,
        people; the plant itself is not visible, only its shadow.
      ultrawide: |
        Extend this exact image into an ultra-wide 3:1 panorama by continuing the scene naturally to the left
        and right. Do not change, move, re-light or re-style anything that already exists. New area on the left:
        smooth, sunlit plaster with only a hint of warm glow. New area on the right: a few more sparse leaf and
        grass shadows trailing off the branch, gradually softer. Same lighting direction, palette, materials and
        level of detail. No seams, no repeated or mirrored objects, no text or logos.
      portrait: |
        Using the attached image as the style and content reference, recompose the same scene as a 9:16 portrait
        wallpaper. The olive-branch shadow enters from the upper right and arcs down to about 45% of the height,
        with grass-blade shadows below it. Same lighting, palette, materials and rendering style. Keep the
        bottom 10% calm. Strictly no text, letters, logos, watermarks or UI.
