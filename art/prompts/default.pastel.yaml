pack: default.pastel
kind: default
title: "Pastel Dream"
styleBible: |
  We are creating a cohesive series of premium desktop wallpapers called Pastel Dream. Every image is soft,
  light and gently surreal, in blush pink (#F6CFD8), lavender (#D3C6EE), mint (#C6EBDD), butter yellow (#FBEBB0)
  and sky (#CFE4F6). Scenes are cloudscapes, pastel deserts, smooth clay-like 3D shapes and calm seas at sunset,
  all with creamy gradients, soft light and no harsh contrast. The look is clean and dreamy, never childish or
  busy. Gradients are perfectly smooth and banding-free. No text, no people, no characters, no frames or
  borders. Keep the left edge and the bottom edge calm and low-detail for desktop icons and the taskbar.
wallpapers:
  - id: pd-01
    title: "Pastel Cloudscape"
    role: default
    tone: light
    setupMatch: [pastel, white]
    tags: [clouds, sky, soft]
    starter: true
    accent: "#F2B8CC"
    focal: { x: 0.64, y: 0.46 }
    upscaler: x4plus-anime
    grain: 0.25
    portrait: true
    prompts:
      landscape: |
        A 16:9 landscape desktop wallpaper. A dreamy sky of big, fluffy clouds in blush pink, lavender and
        butter yellow drifts across a gradient background that fades from soft sky blue at the top to warm cream
        at the horizon. Each cloud is rounded and softly lit from the upper right, with gentle shadow in lilac.
        A small, bright patch of golden light glows between two clouds.
        Style: soft dreamy digital art with creamy gradients and gentle volumetric light, clean and calm.
        Palette: #F6CFD8, #D3C6EE, #FBEBB0 with a sky blue #CFE4F6. Mood: dreamy, gentle, airy.
        Composition: the golden glow between the two largest clouds sits about 54–74% across and 34–58% down.
        The left 15% and the bottom 8% stay calm and low-detail (desktop icons and taskbar go there). Keep every
        important element inside the central 80% of the width and the middle 70% of the height so the image can
        be cropped to other screen shapes.
        Technical: highest available resolution; smooth pastel gradients and clean soft edges on the focal
        subject; perfectly smooth, banding-free gradients; no noise, no vignette, no border or frame.
        Strictly no text, letters, numbers, logos, symbols, watermarks, signatures, UI elements, people,
        animals, characters, hard shadows.
      ultrawide: |
        Extend this exact image into an ultra-wide 3:1 panorama by continuing the scene naturally to the left
        and right. Do not change, move, re-light or re-style anything that already exists. New area on the left:
        soft blue-to-cream sky with a few wisps of pink cloud, low in detail. New area on the right: the clouds
        thin out into streaks of lavender and butter yellow. Same lighting direction, palette, materials and
        level of detail. No seams, no repeated or mirrored objects, no text or logos.
      portrait: |
        Using the attached image as the style and content reference, recompose the same scene as a 9:16 portrait
        wallpaper. The clouds stack vertically with the golden glow at about 42% of the height and soft sky
        above and below. Same lighting, palette, materials and rendering style. Keep the bottom 10% calm.
        Strictly no text, letters, logos, watermarks or UI.
