pack: default.steel-blue-night
kind: default
title: "Steel Blue Night"
styleBible: |
  We are creating a cohesive series of premium desktop wallpapers called Steel Blue Night. Every image is a
  cool, moody night scene in steel blue (#4A6A8A), slate (#2B3A4A), deep midnight (#0C141C) and cold white
  (#DCE6EE), with only occasional restrained pale lights. The look is cinematic night photography with soft
  bokeh, rain, fog and concrete, calm and slightly melancholic, never busy or neon. Darks are rich with visible
  form. Gradients are smooth and banding-free. No text, no readable signs, no people, no frames or borders. Keep
  the left edge and the bottom edge calm and low-detail for desktop icons and the taskbar.
