    prompts:
      landscape: |
        A 16:9 landscape desktop wallpaper. A tall concrete chamber with smooth board-marked walls is cut by a
        single sharp shaft of sunlight falling from a narrow opening high above. The beam lands as a bright
        diagonal blade across the opposite wall and floor, its edges crisp, with soft grey bounce light filling
        the shadow. The concrete shows fine, even texture and subtle tonal variation.
        Style: contemporary architectural photography, strong natural light, clean geometry, precise and quiet.
        Palette: #EDEAE4, #BFBDB8, #7A7873 with a deep shadow #2A2927. Mood: monumental, quiet, focused.
        Composition: the bright blade of light on the wall sits about 56–76% across and 34–58% down. The left
        15% and the bottom 8% stay calm and low-detail (desktop icons and taskbar go there). Keep every
        important element inside the central 80% of the width and the middle 70% of the height so the image can
        be cropped to other screen shapes.
        Technical: highest available resolution; crisp edges and fine material texture along the light edge;
        perfectly smooth, banding-free gradients; no noise, no vignette, no border or frame.
        Strictly no text, letters, numbers, logos, symbols, watermarks, signatures, UI elements, people, windows
        with detail, furniture, plants, text.
      ultrawide: |
        Extend this exact image into an ultra-wide 3:1 panorama by continuing the scene naturally to the left
        and right. Do not change, move, re-light or re-style anything that already exists. New area on the left:
        calm grey concrete wall in even soft shadow, low in detail. New area on the right: the wall continues
        with a second, thinner shaft of light far away, fading. Same lighting direction, palette, materials and
        level of detail. No seams, no repeated or mirrored objects, no text or logos.
      portrait: |
        Using the attached image as the style and content reference, recompose the same scene as a 9:16 portrait
        wallpaper. The light blade runs diagonally from the upper right to about 55% of the height at the lower
        left, over plain concrete. Same lighting, palette, materials and rendering style. Keep the bottom 10%
