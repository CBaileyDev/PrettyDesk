pack: default.architectural
kind: default
title: "Architecture & Light"
styleBible: |
  We are creating a cohesive series of premium desktop wallpapers called Architecture and Light. Every image is
  a study in concrete, plaster, glass and stone with strong light and shadow: brutalist forms, curved stairs,
  light shafts, minimal pools and arches in sun. Palettes are restrained greys and warm whites (#F0EEEA,
  #BFBDB8, #7A7873, #2A2927) with at most one soft accent such as a sliver of sky blue. The look is contemporary
  architectural photography with clean geometry, rich tonal range and large areas of calm surface. Gradients are
  smooth and banding-free. No text, no signs, no people, no frames or borders. Keep the left edge and the bottom
  edge calm and low-detail for desktop icons and the taskbar.
wallpapers:
  - id: ar-01
