pack: default.neon-minimal
kind: default
title: "Neon Minimal"
styleBible: |
  We are creating a cohesive series of premium desktop wallpapers called Neon Minimal. Every image is near-black
  (#050507 to #12121A) with exactly ONE neon accent color per image, chosen from magenta (#FF2D95), cyan
  (#19E3F0), violet (#8A5CFF) or orange (#FF7A1A). The look is sleek, quiet synthwave minimalism: a single light
  line in a dark room, wet-street reflections, a minimal sunset grid, a glowing ring in fog. There is lots of
  empty dark space, soft glow and gentle bloom, never busy, never multi-colored. Gradients are smooth and
  banding-free. No text, no signs, no people, no frames or borders. Keep the left edge and the bottom edge calm
  and dark for desktop icons and the taskbar.
wallpapers:
  - id: nm-01
    title: "Single Magenta Line"
    role: default
    tone: dark
    setupMatch: [black, rgb]
    tags: [magenta, line, dark-room]
    starter: true
    accent: "#FF2D95"
    focal: { x: 0.66, y: 0.52 }
    upscaler: x4plus
    grain: 0.25
    portrait: true
    prompts:
      landscape: |
        A 16:9 landscape desktop wallpaper. A single thin horizontal neon tube glows magenta on a bare,
        near-black wall in an empty dark room. The light spills softly over the matte wall and across a glossy
        black floor, where it forms a faint, blurred reflection. A trace of pink bloom softens the ends of the
        tube, and everything else stays in deep shadow.
        Style: minimalist cinematic digital art, a single neon light source with soft bloom, deep blacks, sleek
        and quiet.
        Palette: #050507, #0F0F16, #1A1A24 with a neon magenta #FF2D95. Mood: sleek, quiet, modern.
        Composition: the glowing line and its reflection sits about 56–76% across and 42–62% down. The left 15%
        and the bottom 8% stay calm and low-detail (desktop icons and taskbar go there). Keep every important
        element inside the central 80% of the width and the middle 70% of the height so the image can be cropped
        to other screen shapes.
        Technical: highest available resolution; crisp, clean glowing edges on the neon subject; perfectly
        smooth, banding-free gradients; no noise, no vignette, no border or frame.
        Strictly no text, letters, numbers, logos, symbols, watermarks, signatures, UI elements, furniture,
        readable signs, people, other colored lights.
      ultrawide: |
        Extend this exact image into an ultra-wide 3:1 panorama by continuing the scene naturally to the left
        and right. Do not change, move, re-light or re-style anything that already exists. New area on the left:
        a deep black wall and floor with a faint magenta haze, low in detail. New area on the right: the neon
        line ends in a soft glow, with the wall continuing into black. Same lighting direction, palette,
        materials and level of detail. No seams, no repeated or mirrored objects, no text or logos.
      portrait: |
        Using the attached image as the style and content reference, recompose the same scene as a 9:16 portrait
        wallpaper. The neon line crosses the center at about 50% of the height, with its reflection in the
        glossy floor below. Same lighting, palette, materials and rendering style. Keep the bottom 10% calm.
        Strictly no text, letters, logos, watermarks or UI.
    reviewNotes: "Generated with built-in imagegen; visually reviewed in contact sheet by Codex on 2026-10-01."
    approved: true
