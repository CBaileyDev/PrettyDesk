pack: default.cozy-lofi
kind: default
title: "Cozy Lo-fi"
styleBible: |
  We are creating a cohesive series of premium desktop wallpapers called Cozy Lo-fi. Every image is a
  hand-painted animated-film background: warm lamp amber (#F2B25C) against dusk blue (#2E3F66) and soft plum,
  with painterly brushwork, gentle gradients and a slightly nostalgic mood. Interiors and rooftops are tidy,
  quiet and lived-in, with rain, plants, warm lights and soft shadows. There are never any characters, animals
  or people. No text, no readable book spines or screens, no frames or borders. Gradients are smooth and
  banding-free. Keep the left edge and the bottom edge calm and low-detail for desktop icons and the taskbar.
wallpapers:
  - id: cl-01
    title: "Desk by the Rainy Window"
    role: default
    tone: dark
    setupMatch: [wood, pastel, black]
    tags: [desk, rain, lamp]
    starter: true
    accent: "#F2B25C"
    focal: { x: 0.66, y: 0.52 }
    upscaler: x4plus-anime
    grain: 0.15
    portrait: true
    prompts:
      landscape: |
        A 16:9 landscape desktop wallpaper. A small wooden desk sits beneath a tall window streaked with rain,
        the city outside a soft blue blur of lights. On the desk, a glowing amber lamp, a steaming mug and a few
        closed notebooks make a warm pool of light. A potted plant leans toward the glass, and the wall behind
        is a dusky plum.
        Style: hand-painted animated-film background, soft gouache brushwork, warm and nostalgic, no characters.
        Palette: #F2B25C, #2E3F66, #6B4A66 with a soft cream #F6E6C8. Mood: cozy, nostalgic, calm.
        Composition: the lamp-lit desk and mug sits about 56–76% across and 40–64% down. The left 15% and the
        bottom 8% stay calm and low-detail (desktop icons and taskbar go there). Keep every important element
        inside the central 80% of the width and the middle 70% of the height so the image can be cropped to
        other screen shapes.
        Technical: highest available resolution; crisp, clean painted detail on the focal area; perfectly
        smooth, banding-free gradients; no noise, no vignette, no border or frame.
        Strictly no text, letters, numbers, logos, symbols, watermarks, signatures, UI elements, characters,
        animals, readable text on books or screens, people.
      ultrawide: |
        Extend this exact image into an ultra-wide 3:1 panorama by continuing the scene naturally to the left
        and right. Do not change, move, re-light or re-style anything that already exists. New area on the left:
        a calm plum wall and the edge of the window, low in detail. New area on the right: the window continues
        with more rain-streaked glass and a distant blue city glow. Same lighting direction, palette, materials
        and level of detail. No seams, no repeated or mirrored objects, no text or logos.
      portrait: |
        Using the attached image as the style and content reference, recompose the same scene as a 9:16 portrait
        wallpaper. The desk and lamp sit in the lower center at about 60% of the height, with the rainy window
        rising above. Same lighting, palette, materials and rendering style. Keep the bottom 10% calm. Strictly
        no text, letters, logos, watermarks or UI.
    reviewNotes: ""
    approved: false
    rawSha256: {}

