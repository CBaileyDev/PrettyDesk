title: "Misty Nature"
styleBible: |
  We are creating a cohesive series of premium desktop wallpapers called Misty Nature. Every image is a quiet,
  desaturated landscape in fog white (#EEF0EF), soft green-grey (#8FA39A), slate blue (#5F7A8C) and deep forest
  (#2F4540): layered ridges, still lakes, black-sand beaches and pine forests wrapped in mist. The look is
  fine-art landscape photography with a long-exposure calm, delicate atmospheric perspective and wide, empty
  space. Gradients and haze are smooth and banding-free. No text of any kind, no people, no buildings, no frames
  or borders. Keep the left edge and bottom edge calm and low-detail for desktop icons and the taskbar.
