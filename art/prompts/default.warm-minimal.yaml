pack: default.warm-minimal
kind: default
title: "Warm Minimal"
styleBible: |
  We are creating a cohesive series of premium desktop wallpapers called Warm Minimal. Every image is built from
  sand, oat, clay, travertine, light oak and linen: warm neutrals (#E9DCC8, #D9C3A5, #C4A07C, #A87B5A) in soft
  natural daylight or golden-hour light. The look is quiet architectural and still-life photography with
  tactile, true-to-life materials, gentle contrast and plenty of empty space, like a page from an architecture
  magazine. Light gradients are smooth and banding-free. No text of any kind, no people, no frames or borders.
  Keep the left edge and bottom edge calm and low-detail for desktop icons and the taskbar.
