pack: default.matte-black
kind: default
title: "Matte Black"
styleBible: |
  We are creating a cohesive series of premium desktop wallpapers called Matte Black. Every image lives in true
  blacks and deep charcoals (#050506 to #1A1B1E) with exactly one restrained rim light, either a cool
  silver-blue or a warm amber, that reveals form without lighting the whole scene. The look is high-end fine-art
  photography with a medium-format feel: sculptural, quiet, OLED-friendly and luxurious. Darks are rich but
  never crushed, so form stays visible in the shadows. Skies and empty areas are seamless, banding-free
  gradients. No text of any kind, no people, no frames or borders. Keep the left edge and bottom edge calm for
  desktop icons and the taskbar.
wallpapers:
  - id: mb-01
    title: "Obsidian Dune"
    role: default
    tone: dark
    setupMatch: [black, rgb]
    tags: [minimal, oled, sculptural]
    starter: true
    accent: "#AEB4BC"
    focal: { x: 0.66, y: 0.50 }
    upscaler: x4plus
    grain: 0.25
    portrait: true
    prompts:
      landscape: |
        A 16:9 landscape desktop wallpaper. An ultra-minimal scene of a single smooth sand dune made of fine
        matte-black sand. Its sharp, curved crest sweeps from the lower right toward the center of the frame. A
        faint cool silver rim light grazes the crest from the upper right, revealing delicate wind ripples on
        the slope; everything else falls away into deep charcoal and true black. The sky is a seamless
        near-black gradient with no stars.
        Style: high-end fine-art photography with a medium-format look; sculptural, quiet and luxurious.
        Palette: #050506, #0E0F11, #1A1B1E with a subtle silver highlight #AEB4BC. Mood: calm, focused, premium.
        Composition: the dune crest, occupying the right half, sits about 56–76% across and 40–60% down. The
        left 15% and the bottom 8% stay calm and low-detail (desktop icons and taskbar go there). Keep every
        important element inside the central 80% of the width and the middle 70% of the height so the image can
        be cropped to other screen shapes.
        Technical: highest available resolution; crisp detail on the ridge; perfectly smooth, banding-free
        gradients; no noise, no vignette, no border or frame.
        Strictly no text, letters, numbers, logos, symbols, watermarks, signatures, UI elements, people,
        animals.
      ultrawide: |
        Extend this exact image into an ultra-wide 3:1 panorama by continuing the scene naturally to the left
        and right. Do not change, move, re-light or re-style anything that already exists. New area on the left:
        calm, near-black empty space with only the faintest suggestion of a low dune. New area on the right: a
        second, smaller dune ridge fading into darkness, catching a whisper of the same silver rim light. Same
        lighting direction, palette, materials and level of detail. No seams, no repeated or mirrored objects,
        no text or logos.
      portrait: |
        Using the attached image as the style and content reference, recompose the same scene as a 9:16 portrait
        wallpaper. The dune crest rises diagonally from the lower right toward the upper center, with its
        brightest rim light at about 40% of the height. Same lighting, palette, materials and rendering style.
        Keep the bottom 10% calm. Strictly no text, letters, logos, watermarks or UI.
    reviewNotes: ""
    approved: false
    rawSha256: {}

