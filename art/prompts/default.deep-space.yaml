pack: default.deep-space
kind: default
title: "Deep Space"
styleBible: |
  We are creating a cohesive series of premium desktop wallpapers called Deep Space. Every image is a quiet
  piece of astronomy art on true black (#000000 to #07080C) with subtle nebula hues in indigo, teal and dusty
  rose and only one bright subject: a planet limb, an eclipse corona, a lunar horizon or a ringed planet edge.
  The look is clean astrophotography with a refined, photographic realism, sparse stars, soft atmospheric glows
  and plenty of true black. Gradients are smooth and banding-free. No text, no spacecraft, no people, no frames
  or borders. Keep the left edge and the bottom edge calm and dark for desktop icons and the taskbar.
wallpapers:
  - id: ds-01
    title: "Planet Limb at Dawn"
    role: default
    tone: dark
    setupMatch: [black, rgb]
    tags: [planet, atmosphere, limb]
    starter: true
    accent: "#6FA8D8"
    focal: { x: 0.64, y: 0.58 }
    upscaler: x4plus
    grain: 0.3
    portrait: true
    prompts:
      landscape: |
        A 16:9 landscape desktop wallpaper. The curved edge of a large planet crosses the lower part of the
        frame like a glowing arc, with a thin, brilliant layer of blue atmosphere on its rim and a pinpoint
        flare of sunrise light where the arc meets the dark. Below the arc the planet is a deep night-side
        blue-black with the faintest hint of cloud texture. Above it stretches clean, true-black space with a
        handful of tiny stars.
        Style: refined astrophotography with photographic realism, deep black, restrained and cinematic.
        Palette: #000000, #06101E, #1D4E7A with an atmosphere glow #6FA8D8. Mood: vast, calm, awe-inspiring.
        Composition: the glowing atmospheric rim and the sunrise flare sits about 54–74% across and 46–70% down.
        The left 15% and the bottom 8% stay calm and low-detail (desktop icons and taskbar go there). Keep every
        important element inside the central 80% of the width and the middle 70% of the height so the image can
        be cropped to other screen shapes.
        Technical: highest available resolution; crisp detail on the bright edge of the subject; perfectly
        smooth, banding-free gradients; no noise, no vignette, no border or frame.
        Strictly no text, letters, numbers, logos, symbols, watermarks, signatures, UI elements, spacecraft,
        satellites, city lights, people, visible text.
      ultrawide: |
        Extend this exact image into an ultra-wide 3:1 panorama by continuing the scene naturally to the left
        and right. Do not change, move, re-light or re-style anything that already exists. New area on the left:
        pure black space with a few distant stars and the faintest hint of the planet's curve. New area on the
        right: the arc continues curving gently away, with the atmosphere thinning out to a pale blue line. Same
        lighting direction, palette, materials and level of detail. No seams, no repeated or mirrored objects,
        no text or logos.
      portrait: |
        Using the attached image as the style and content reference, recompose the same scene as a 9:16 portrait
        wallpaper. The planet arc sweeps across the lower third, with the sunrise flare at about 62% of the
        height and black space above. Same lighting, palette, materials and rendering style. Keep the bottom 10%
        calm. Strictly no text, letters, logos, watermarks or UI.
