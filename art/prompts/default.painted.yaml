pack: default.painted
kind: default
title: "Painted Landscapes"
styleBible: |
  We are creating a cohesive series of premium desktop wallpapers called Painted Landscapes. Every image is an
  original oil painting with visible, confident brushwork and palette-knife impasto: thick ridges of paint
  catching light, soft glazes in the skies, and a harmonious, slightly muted palette of ochre, sage, dusty blue,
  cream and clay. The paintings are calm and uncluttered, with generous areas of softly worked color that read
  as art rather than photographs. Skies and large areas are smooth and banding-free at a distance. No text, no
  signatures, no frames or borders, and no people. Keep the left edge and bottom edge quiet and low-detail for
  desktop icons and the taskbar.
wallpapers:
  - id: pa-01
    title: "Impasto Clouds"
    role: default
    tone: mid
    setupMatch: [wood, pastel]
    tags: [clouds, sky, impasto]
    starter: true
    accent: "#D9B98A"
    focal: { x: 0.64, y: 0.40 }
    upscaler: x4plus
    grain: 0.2
    portrait: true
    prompts:
      landscape: |
        A 16:9 landscape desktop wallpaper. Towering cumulus clouds are built from thick, buttery strokes of
        cream, pale gold and soft blue-grey over a deep cerulean sky. A low band of sage-green meadow runs along
        the bottom of the canvas in broad horizontal strokes. Light falls from the upper right, so the sunlit
        edges of the clouds stand in high relief of raised paint.
        Style: original oil painting with visible brushwork and palette-knife impasto, soft glazes,
        gallery-quality canvas texture.
        Palette: #EFE4CB, #D9B98A, #6E8EA8 with a deep sky blue #3F6389. Mood: airy, bold, uplifting.
        Composition: the brightest cloud mass and its raised paint ridges sits about 54–74% across and 28–52%
        down. The left 15% and the bottom 8% stay calm and low-detail (desktop icons and taskbar go there). Keep
        every important element inside the central 80% of the width and the middle 70% of the height so the
        image can be cropped to other screen shapes.
        Technical: highest available resolution; crisp, expressive brushstroke and paint-ridge detail on the
        focal area; perfectly smooth, banding-free gradients; no noise, no vignette, no border or frame.
        Strictly no text, letters, numbers, logos, symbols, watermarks, signatures, UI elements, signatures,
        canvas edges, frames, people.
      ultrawide: |
        Extend this exact image into an ultra-wide 3:1 panorama by continuing the scene naturally to the left
        and right. Do not change, move, re-light or re-style anything that already exists. New area on the left:
        a calm sweep of blue sky glazed in thin, soft strokes with only a hint of cloud. New area on the right:
        the clouds drift apart into thinner streaks of cream over the blue, above the faint green meadow. Same
        lighting direction, palette, materials and level of detail. No seams, no repeated or mirrored objects,
        no text or logos.
      portrait: |
        Using the attached image as the style and content reference, recompose the same scene as a 9:16 portrait
        wallpaper. The clouds tower vertically with the brightest mass at about 38% of the height, above a
        narrow green meadow at the bottom. Same lighting, palette, materials and rendering style. Keep the
