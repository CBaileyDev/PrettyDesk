pack: default.ios-glass
kind: default
title: Liquid Glass · iOS Inspired
styleBible: A cohesive three-piece capsule of original optical sculptures. Large translucent
  glass ribbons form flowing arcs with luminous edges, subtle chromatic dispersion
  and smooth refraction. Quiet fields of color at the left edge leave room for desktop
  icons. Each colorway uses the same material vocabulary with distinctive cool, warm
  or midnight lighting. No logos, text, devices or copied stock artwork.
wallpapers:
  - id: ios.tide
    title: Tide
    role: default
    tone: light
    setupMatch:
      - white
      - pastel
      - rgb
      - black
    tags:
      - ios-inspired
      - glass
      - abstract
      - bundled
    starter: true
    accent: '#44BFEF'
    focal:
      x: 0.55
      y: 0.5
    upscaler: x4plus-anime
    grain: 0
    portrait: true
    prompts:
      landscape: 'A 16:9 landscape desktop wallpaper. Three large translucent curved
        ribbons overlap in an elegant optical sculpture. Luminous edges refract the
        background into soft chromatic highlights; broad arcs sweep upward from the
        lower right. Style: original abstract digital sculpture with tangible glass
        depth and impeccable smooth shading. Palette: #44BFEF, #174BA8, #E7F5FC. Composition:
        the overlapping curves sit about 50-75% across and 35-65% down. The left 15%
        and the bottom 8% stay calm and low-detail (desktop icons and taskbar go there).
        Keep every important element inside the central 80% of the width and the middle
        70% of the height so the image can be cropped to other screen shapes. Technical:
        highest available resolution; smooth blended color transitions; perfectly
        smooth, banding-free gradients; no noise, no vignette, no border or frame.
        Strictly no text, letters, numbers, logos, symbols, watermarks, signatures,
        UI elements, people or devices.'
      ultrawide: 'Extend this exact image into an ultra-wide 3:1 panorama by continuing
        the glass scene naturally to the left and right. New area on the left: a luminous
        quiet color field with faint reflected caustic light. New area on the right:
        elegant glass arcs dissolve into the soft background glow. Same palette and
        material. No seams, repeated or mirrored objects, text or logos.'
      portrait: Using the attached image as the style and content reference, recompose
        the same scene as a 9:16 portrait wallpaper. Glass curves sweep upward from
        the lower right, leaving a calm upper third. Same palette, refraction and
        material. Keep the bottom 10% calm. Strictly no text, logos, UI, watermarks
        or devices.
    approved: true
    reviewNotes: Generated with built-in imagegen; all landscape, ultrawide and portrait
      masters visually reviewed on 2026-10-01.
