styleBible: We are creating original Rocket League fan art with recognizable Octane, Fennec and 2016 Batmobile geometry,
  newly composed arena scenes and restrained in-game materials. Keep the left edge and bottom calm for desktop use.
  Use coherent cool blue and warm orange light, smooth shadows, precise wheels and quiet backgrounds. No HUD, readable
  text, logos, team decals or watermarks. Review car fidelity and all crops before approval. Existing generic wallpapers
  remain available until replacements pass review.
