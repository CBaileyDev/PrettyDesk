pack: default.soft-gradients
kind: default
title: "Aura Gradients"
styleBible: |
  We are creating a cohesive series of premium desktop wallpapers called Aura Gradients. Every image is a soft
  aura or mesh gradient: large, smoothly blended fields of color with gentle luminous shapes such as ribbons,
  frosted-glass orbs and drifting blurred blobs, finished with a very fine film grain. Palettes rotate between
  dusk peach, ocean teal, lavender haze, graphite and mint, always with two to four harmonious hues per image.
  The look is modern, calm and abstract, with original shapes only (never imitate any operating system's default
  wallpapers). Gradients are perfectly smooth and banding-free. No text, no objects, no people, no frames. Keep
  the left edge and bottom edge calm for desktop icons and the taskbar.
wallpapers:
  - id: sg-01
    title: "Dusk Peach Ribbons"
    role: default
    tone: light
    setupMatch: [pastel, white]
    tags: [peach, ribbon, warm]
    starter: true
    accent: "#F4A38C"
    focal: { x: 0.64, y: 0.48 }
    upscaler: x4plus-anime
    grain: 0.3
    portrait: true
    prompts:
      landscape: |
        A 16:9 landscape desktop wallpaper. Two broad, translucent ribbons of color sweep in a slow S-curve
        across a soft gradient field that moves from warm apricot at the bottom to pale rose and cream at the
        top. Where the ribbons overlap, they blend into a glowing coral. Their edges are feathered and
        weightless, with no hard lines anywhere.
        Style: abstract digital art, soft mesh gradient with fine film grain, modern and calm.
        Palette: #FFD9BF, #F4A38C, #E58AA0 with a cream highlight #FFF1E0. Mood: warm, gentle, optimistic.
        Composition: the overlap of the two ribbons sits about 54–74% across and 38–58% down. The left 15% and
        the bottom 8% stay calm and low-detail (desktop icons and taskbar go there). Keep every important
        element inside the central 80% of the width and the middle 70% of the height so the image can be cropped
        to other screen shapes.
        Technical: highest available resolution; smooth blended color transitions; perfectly smooth,
        banding-free gradients; no noise, no vignette, no border or frame.
        Strictly no text, letters, numbers, logos, symbols, watermarks, signatures, UI elements, people,
        objects, hard-edged shapes.
      ultrawide: |
        Extend this exact image into an ultra-wide 3:1 panorama by continuing the scene naturally to the left
        and right. Do not change, move, re-light or re-style anything that already exists. New area on the left:
        a clean apricot-to-cream gradient with only the faintest blur of the ribbons. New area on the right: the
        ribbons thin out and dissolve into soft rose haze. Same lighting direction, palette, materials and level
        of detail. No seams, no repeated or mirrored objects, no text or logos.
      portrait: |
        Using the attached image as the style and content reference, recompose the same scene as a 9:16 portrait
        wallpaper. The ribbons sweep diagonally from the lower left to the upper right, overlapping at about 45%
        of the height. Same lighting, palette, materials and rendering style. Keep the bottom 10% calm. Strictly
        no text, letters, logos, watermarks or UI.
